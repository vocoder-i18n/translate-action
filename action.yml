name: 'Vocoder Translate'
description: 'Translate i18n strings via Vocoder and commit locale files'
branding:
  icon: 'globe'
  color: 'blue'
inputs:
  api-key:
    description: 'Vocoder project API key (use secrets.VOCODER_API_KEY)'
    required: true
  commit-mode:
    description: 'How to commit translated files: "pr" (open a pull request) or "direct" (push to current branch). The server-returned commitMode from the translate result takes precedence over this input when present.'
    required: false
    default: 'pr'
  on-failure:
    description: 'fail (halt workflow) or proceed (continue with stale translations)'
    required: false
    default: 'proceed'
  cli-version:
    description: 'Pin a specific @vocoder/cli version'
    required: false
    default: 'latest'
runs:
  using: 'composite'
  steps:
    - name: Run Vocoder translate
      shell: bash
      env:
        VOCODER_API_KEY: ${{ inputs.api-key }}
        VOCODER_ON_FAILURE: ${{ inputs.on-failure }}
      run: |
        npx --yes @vocoder/cli@${{ inputs.cli-version }} translate

    - name: Commit locale files
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VOCODER_COMMIT_MODE: ${{ inputs.commit-mode }}
      run: ${{ github.action_path }}/scripts/commit-locale-files.sh
