name: 'Vocoder Translate'
description: 'Translate i18n strings via Vocoder and commit locale files'
branding:
  icon: 'globe'
  color: 'blue'
inputs:
  api-key:
    description: 'Vocoder project API key (use secrets.VOCODER_API_KEY)'
    required: true
  commit-mode:
    description: 'How to commit translated files: "pr" (open a pull request) or "direct" (push to current branch). The server-returned commitMode from the translate result takes precedence over this input when present.'
    required: false
    default: 'pr'
  on-failure:
    description: 'fail (halt workflow) or proceed (continue with stale translations)'
    required: false
    default: 'proceed'
  cli-version:
    description: 'Pin a specific @vocoder/cli version'
    required: false
    default: 'latest'
runs:
  using: 'composite'
  steps:
    # No `${{ }}` expression appears in any `run:` body. GitHub substitutes
    # expressions into the script text before bash ever sees it, so an input
    # carrying `; rm -rf /` would execute as its own command. Every value
    # reaches the shell through `env:` instead, where it arrives as data and
    # is quoted at the point of use. tests/action-yml.test.sh enforces this.
    - name: Run Vocoder translate
      shell: bash
      env:
        VOCODER_API_KEY: ${{ inputs.api-key }}
        VOCODER_ON_FAILURE: ${{ inputs.on-failure }}
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        npx --yes "@vocoder/cli@${CLI_VERSION}" translate

    # GITHUB_ACTION_PATH is set by the runner for composite actions, so the
    # script's location needs no expression either.
    - name: Commit locale files
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VOCODER_COMMIT_MODE: ${{ inputs.commit-mode }}
      run: |
        "$GITHUB_ACTION_PATH/scripts/commit-locale-files.sh"
